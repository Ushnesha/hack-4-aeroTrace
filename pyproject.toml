[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerotrace"
version = "0.1.0"
description = "Evidence-first, read-only understanding and change-impact tool for legacy C avionics code."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["aerotrace*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
